{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b5ed7">
  <title>Offline | Campus Nexus</title>
  <style>
    :root {
      color-scheme: light;
      --cnx-blue: #0b5ed7;
      --cnx-ink: #1f2937;
      --cnx-muted: #667085;
      --cnx-line: #d9e2ef;
      --cnx-bg: #f5f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--cnx-bg);
      color: var(--cnx-ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }

    main {
      width: min(100%, 440px);
      border: 1px solid var(--cnx-line);
      border-radius: 8px;
      background: #fff;
      padding: 32px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(31, 41, 55, 0.08);
    }

    img {
      width: 84px;
      height: 84px;
      object-fit: contain;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.5rem;
      line-height: 1.25;
    }

    p {
      margin: 0 0 24px;
      color: var(--cnx-muted);
      line-height: 1.55;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      padding: 0 18px;
      background: var(--cnx-blue);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="{% static 'img/CAMPUS_NEXUS.png' %}" alt="Campus Nexus">
    <h1>You are currently offline</h1>
    <p>Please check your internet connection and try again.</p>
    <button type="button" onclick="window.location.reload()">Retry</button>
  </main>
</body>
</html>
