{% extends "admin/base_site.html" %}

{% block content %}
<div class="container-fluid">
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white d-flex align-items-center justify-content-between">
      <strong>{{ title }}</strong>
      <a class="btn btn-sm btn-outline-secondary" href="{% url 'admin:import_export_centre' %}">
        <i class="fas fa-arrow-left"></i> Back
      </a>
    </div>
    <div class="card-body">
      <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        <div class="form-group">
          <label for="id_file">CSV or Excel file</label>
          <input id="id_file" class="form-control" type="file" name="file" accept=".csv,.xlsx" required>
          <small class="form-text text-muted">The file is validated and previewed before anything is saved.</small>
        </div>
        <div class="form-group">
          <label for="id_mode">Import mode</label>
          <select id="id_mode" class="form-control" name="mode">
            <option value="create">Create only</option>
            {% if spec.updateable %}
              <option value="upsert">Create and update</option>
            {% endif %}
          </select>
        </div>
        <div class="mb-3">
          <div class="text-muted small mb-1">Expected columns</div>
          <code>{{ spec.fields|join:", " }}</code>
        </div>
        <button class="btn btn-primary" type="submit">
          <i class="fas fa-search"></i> Validate & Preview
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
